<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="%BASE_URL%icons/icon-192.png"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- 默认 orange 方案的 --background；首屏脚本按实际主题合并成一条。 -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#faf9f5"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0a0a0a"
    />

    <!-- PWA iOS Support -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent 的状态栏文字恒为白色，亮色主题下看不清，保留 default。 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HappyClaw" />
    <link
      rel="apple-touch-icon"
      href="%BASE_URL%icons/apple-touch-icon-180.png"
    />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />

    <!-- 电话、邮箱、日期、地址都不自动识别成链接（自动加链接会改写消息里的文本） -->
    <meta
      name="format-detection"
      content="telephone=no, email=no, date=no, address=no"
    />

    <!-- 预热认证：AuthGuard 放行前整棵已登录子树都不渲染，若等入口 JS 执行后
         才发 /api/auth/me，这个 RTT 会和分片下载串行。这里在 HTML 解析阶段就
         发出请求，stores/auth.ts 一次性消费 window.__authPrewarm。 -->
    <script>
      window.__authPrewarm = fetch('%BASE_URL%api/auth/me', {
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
      }).catch(function () {
        return null;
      });
      // 已登录页面同时预发 /api/groups：侧边栏和会话路由都要等工作区列表，
      // 否则它要等应用壳挂载后才发出。stores/chat.ts 的首次 loadGroups 一次性
      // 消费 window.__groupsPrewarm；登录、注册和初始化页不发，未登录时为 null。
      (function () {
        var base = '%BASE_URL%';
        var hashRoute =
          location.hash.indexOf('#/') === 0 ? location.hash.slice(1) : '';
        var route = hashRoute || location.pathname;
        if (!hashRoute && route.indexOf(base) === 0) {
          route = '/' + route.slice(base.length);
        }
        if (/^\/(?:login|register|setup)(?:\/|$)/.test(route)) return;
        window.__groupsPrewarm = fetch(base + 'api/groups', {
          credentials: 'include',
        })
          .then(function (res) {
            return res.ok ? res.json() : null;
          })
          .catch(function () {
            return null;
          });
      })();
    </script>

    <title>HappyClaw</title>
  </head>
  <body>
    <script>
      (function () {
        var d = document.documentElement,
          s = localStorage.getItem('happyclaw-theme');
        if (
          s === 'dark' ||
          (s === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        )
          d.classList.add('dark');
        // Mirrors readColorScheme() in src/hooks/useTheme.ts: a missing or
        // unknown key means the default orange scheme.
        var c = localStorage.getItem('happyclaw-color-scheme');
        if (c === 'neutral') d.classList.add('theme-neutral');
        else if (c === 'ios') d.classList.add('theme-ios');
        else if (c !== 'default') d.classList.add('theme-orange');
        // 主题已确定：两条按系统明暗的 theme-color 合并成一条，useTheme 之后
        // 只更新这一条。
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        var m = metas[0];
        for (var i = 1; i < metas.length; i++) metas[i].remove();
        if (m) {
          m.removeAttribute('media');
          m.setAttribute(
            'content',
            getComputedStyle(d).getPropertyValue('--background').trim() ||
              '#faf9f5',
          );
        }
        if (localStorage.getItem('happyclaw-font-style') === 'anthropic')
          d.classList.add('font-anthropic');
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
